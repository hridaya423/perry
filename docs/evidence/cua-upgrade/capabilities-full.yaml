version: 3
expires_after: 8h
idle_timeout: 30m

allow:
  tools:
    - check_permissions
    - start_session
    - get_session_state
    - end_session
    - list_apps
    - list_windows
    - get_window_state
    - get_desktop_state
    - get_cursor_position
    - zoom
    - click
    - right_click
    - double_click
    - scroll
    - type_text
    - press_key
    - hotkey
    - drag
    - set_value
    - invoke_menu
    - verify_state
    - launch_app
    - clipboard_read
    - clipboard_write
    - get_browser_state
    - browser_click
    - browser_dialog
    - browser_download
    - browser_navigate
    - browser_pointer
    - browser_prepare
    - browser_set_input_files
    - browser_type

resources:
  desktop:
    display: true

  apps:
    - bundle_id: com.BlueBubbles.BlueBubbles-Server
      launch: true
      windows: all
      terminate: deny
