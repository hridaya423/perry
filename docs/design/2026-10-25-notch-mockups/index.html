<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Perry notch mockups, 2026-10-25</title>
<style>
  :root {
    --crown: #000000;
    --body: #1A1B1D;
    --card: #232427;
    --chip: #2C2D31;
    --sep: rgba(255,255,255,.08);
    --text: #F5F2EA;
    --text2: #A6A59F;
    --text3: #8B8A85;
    --accent: #7BE3BD;
    --eye: #F4F1E8;
    --caution: #FFB020;
    --old-accent: #9CCBB6;
    --notch-w: 188px;
    --notch-h: 32px;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--foreground, #e8e6e1);
    -webkit-font-smoothing: antialiased;
  }
  .page { display: grid; gap: 40px; padding-block: 8px 24px; }
  section { display: grid; gap: 14px; }
  h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .lede { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted-foreground, #a6a59f); max-width: 64ch; }
  .variant { display: grid; gap: 10px; }
  .variant-head { display: flex; align-items: baseline; gap: 10px; }
  .variant-head b { font-size: 13px; font-weight: 600; }
  .variant-head span { font-size: 12.5px; color: var(--muted-foreground, #a6a59f); }
  .pair { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
  .bezel { background: #0b0b0c; border-radius: var(--radius, 12px); padding: 16px; }
  .screen { position: relative; height: 88px; overflow: hidden; border-radius: 4px; }
  .screen.tall { height: 300px; }
  .screen.light { background: linear-gradient(180deg, #c9d6e3 0%, #e7e1d6 100%); }
  .screen.dark { background: radial-gradient(120% 140% at 30% 0%, #26304a 0%, #141824 55%, #0c0e14 100%); }
  .menubar { position: absolute; inset: 0 0 auto 0; height: var(--notch-h); }
  .light .menubar { background: rgba(246,246,246,.55); box-shadow: inset 0 -1px rgba(0,0,0,.05); }
  .dark .menubar { background: rgba(0,0,0,.28); box-shadow: inset 0 -1px rgba(255,255,255,.04); }
  .hw { position: absolute; top: 0; left: 50%; width: var(--notch-w); height: var(--notch-h); margin-left: calc(var(--notch-w) / -2);
        background: #000; border-radius: 0 0 9px 9px; }
  svg.shape { position: absolute; top: 0; left: 50%; overflow: visible; }
  .eyes { position: absolute; top: calc(var(--notch-h) / 2); display: flex; gap: 8px; transform: translate(-50%, -50%);
          transition: transform 120ms var(--ease-out); }
  .eye { width: 7px; height: 12px; border-radius: 3.5px; background: var(--eye);
         box-shadow: 0 0 6px 1px rgba(123,227,189,.30); transform-origin: 50% 50%; }
  .eyes.old { gap: 4px; }
  .eyes.old .eye { width: 3.5px; height: 9px; border-radius: 1.75px; background: var(--old-accent); box-shadow: none; }
  .eyes.listen .eye { width: 8px; height: 14px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 6px 2px rgba(123,227,189,.55); }
  .eyes.review .eye { height: 14px; background: var(--caution); box-shadow: 0 0 6px 1px rgba(255,176,32,.35); }
  .eyes.sleep { gap: 8px; }
  .eyes.sleep .eye { height: 2.5px; border-radius: 0 0 4px 4px; background: transparent; box-shadow: none;
                     border-bottom: 2px solid rgba(244,241,232,.6); width: 7px; }
  .eyes.glance { transform: translate(calc(-50% - 2px), calc(-50% + 1px)); }
  .blink .eye { animation: blink 150ms ease-in-out; }
  @keyframes blink { 50% { transform: scaleY(.08); } }
  .hoverable:hover .wing-swell { transform: scale(1.06, 1.12); }
  .hoverable:hover .eyes:not(.old) { transform: translate(-50%, calc(-50% + 1px)) scale(1.12); }
  .wing-swell { transform-origin: 50% 0; transition: transform 300ms cubic-bezier(.34,1.3,.64,1); }
  .pointer { position: absolute; top: calc(var(--notch-h) / 2); transform: translate(-50%, -50%); transition: transform 120ms var(--ease-out); }
  .hoverable:hover .pointer { transform: translate(-50%, calc(-50% + 1px)) scale(1.12); }
  .detail { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 8px; }
  .tile { display: grid; gap: 6px; justify-items: center; }
  .tile .well { position: relative; width: 100%; height: 64px; background: #000; border-radius: 8px; overflow: hidden; }
  .tile .well .zoom { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: scale(3); }
  .tile .well .zoom .eyes, .tile .well .zoom .pointer { top: 0; left: 0; }
  .tile small { font-size: 11px; font-weight: 500; color: var(--muted-foreground, #a6a59f); }
  .peek { position: absolute; top: 0; left: 50%; width: 476px; margin-left: -238px; }
  .peek-inner { position: absolute; top: 0; left: 18px; width: 440px; height: 256px; padding: 0 18px; box-sizing: border-box; color: var(--text); }
  .crown { height: 40px; display: flex; align-items: center; justify-content: space-between; }
  .crown .left { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; color: var(--text3); font-variant-numeric: tabular-nums; }
  .iconbtn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--text2); }
  .iconbtn:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .rows { margin-top: 6px; }
  .row { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; column-gap: 12px; align-items: center; height: 50px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 44px; right: 0; height: 1px; background: var(--sep); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--card); position: relative; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .avatar .eyes { top: 16px; left: 16px; gap: 3.5px; }
  .avatar .eye { width: 3.5px; height: 6.5px; border-radius: 1.75px; box-shadow: 0 0 3px rgba(123,227,189,.35); }
  .avatar .eyes.review .eye { height: 7px; box-shadow: 0 0 3px rgba(255,176,32,.4); }
  .row .t { font-size: 14px; font-weight: 600; line-height: 18px; }
  .row .s { font-size: 12.5px; color: var(--text2); line-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .m { font-size: 11px; font-weight: 500; color: var(--text3); font-variant-numeric: tabular-nums; }
  .footer { position: absolute; left: 18px; right: 18px; bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .chip { height: 32px; border-radius: 16px; padding: 0 12px 0 10px; display: inline-flex; align-items: center; gap: 6px;
          font-size: 13px; font-weight: 500; background: var(--chip); color: var(--text); white-space: nowrap; }
  .chip.primary { background: var(--text); color: #0C0D0E; }
  .chip.primary kbd { font: inherit; font-size: 11px; color: rgba(12,13,14,.55); margin-left: 2px; }
  .round { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; color: var(--text2); }
  .wave { position: absolute; top: calc(var(--notch-h) / 2); display: flex; gap: 2px; align-items: center; transform: translate(-50%, -50%); }
  .wave i { width: 2px; border-radius: 1px; background: var(--accent); animation: wave 900ms ease-in-out infinite; }
  .wave i:nth-child(1) { height: 5px; animation-delay: -.2s; }
  .wave i:nth-child(2) { height: 11px; animation-delay: -.5s; }
  .wave i:nth-child(3) { height: 8px; animation-delay: -.1s; }
  .wave i:nth-child(4) { height: 13px; animation-delay: -.7s; }
  .wave i:nth-child(5) { height: 6px; animation-delay: -.35s; }
  @keyframes wave { 50% { transform: scaleY(.45); } }
  .notes { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.55; color: var(--muted-foreground, #a6a59f); }
  .notes b { color: var(--foreground, #e8e6e1); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) {
    .wave i, .blink .eye { animation: none; }
    .wing-swell, .eyes, .pointer { transition: none; }
  }
  @media (max-width: 520px) {
    .pair { grid-template-columns: minmax(0,1fr); }
    .detail { grid-template-columns: repeat(3, minmax(0,1fr)); }
  }
</style>
</head>
<body>
<div class="page" id="page"></div>
<template id="icons">
  <svg data-name="gear" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M3.5 12.5l1.3-1.3M11.2 4.8l1.3-1.3"/></svg>
  <svg data-name="expand" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9"/></svg>
  <svg data-name="plus" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
  <svg data-name="mic" width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  <svg data-name="dotted" width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="2" r="1.3"/><circle cx="12.2" cy="3.8" r="1.3"/><circle cx="14" cy="8" r="1.3"/><circle cx="12.2" cy="12.2" r="1.3"/><circle cx="8" cy="14" r="1.3"/><circle cx="3.8" cy="12.2" r="1.3"/><circle cx="2" cy="8" r="1.3"/><circle cx="3.8" cy="3.8" r="1.3"/></svg>
</template>
<script>
const NW = 188, NH = 32;
const icon = name => document.getElementById("icons").content.querySelector(`svg[data-name="${name}"]`).outerHTML;

function silhouette({ left, right, height = NH, ear = 6, bottom = 14 }) {
  const w = right - left, x0 = -ear;
  const d = [
    `M ${x0} 0`, `Q 0 0 0 ${ear}`, `L 0 ${height - bottom}`, `Q 0 ${height} ${bottom} ${height}`,
    `L ${w - bottom} ${height}`, `Q ${w} ${height} ${w} ${height - bottom}`, `L ${w} ${ear}`, `Q ${w} 0 ${w + ear} 0`, 'Z'
  ].join(' ');
  return { d, w, left, ear };
}

function shapeSVG(s, fill = '#000', extra = '') {
  return `<svg class="shape wing-swell" width="${s.w + s.ear * 2}" height="${NH + 40}" viewBox="${-s.ear} 0 ${s.w + s.ear * 2} ${NH + 40}"
    style="margin-left:${s.left - s.ear}px">${extra}<path d="${s.d}" fill="${fill}"/></svg>`;
}

const eyes = (cls, cx) => `<div class="eyes ${cls}" style="left:calc(50% + ${cx}px)"><div class="eye"></div><div class="eye"></div></div>`;

function pointerMascot(cx) {
  return `<div class="pointer" style="left:calc(50% + ${cx}px)">
    <svg width="13" height="16" viewBox="0 0 13 16" style="display:block;filter:drop-shadow(0 0 3px rgba(123,227,189,.45))">
      <path d="M1.4 1.2 L11.6 8.6 Q12.3 9.2 11.4 9.5 L7.3 10.4 L5.2 14.3 Q4.8 15 4.4 14.2 L1 1.9 Q0.8 0.9 1.4 1.2 Z" fill="#7BE3BD"/>
      <rect x="3.6" y="5.4" width="1.5" height="3" rx=".75" fill="#0C0D0E"/><rect x="6.1" y="6.6" width="1.5" height="3" rx=".75" fill="#0C0D0E"/>
    </svg></div>`;
}

const half = NW / 2;
const variants = {
  current: {
    title: 'A · Today', note: 'Black plate 26 pt past both notch edges, 3.5 × 9 mint eyes in the right ear.',
    shape: () => silhouette({ left: -half - 26, right: half + 26, ear: 0, bottom: 9 }),
    face: () => eyes('old', half + 11)
  },
  capsules: {
    title: 'B · Capsule eyes', note: 'One 38 pt wing on the right; 7 × 12 warm-white capsules with a soft mint glow (r6 §7.2).',
    shape: () => silhouette({ left: -half - 2, right: half + 2 + 38 }),
    face: () => eyes('', half + 2 + 19)
  },
  pointer: {
    title: 'C · Pointer mascot', note: 'Same wing; Perry’s pointer with two eyes stands in for the eye pair.',
    shape: () => silhouette({ left: -half - 2, right: half + 2 + 38 }),
    face: () => pointerMascot(half + 2 + 19)
  }
};

function screen(theme, v) {
  const s = v.shape();
  return `<div class="bezel"><div class="screen ${theme} hoverable"><div class="menubar"></div><div class="hw"></div>${shapeSVG(s)}${v.face()}</div></div>`;
}

function tile(label, inner) {
  return `<div class="tile"><div class="well"><div class="zoom">${inner}</div></div><small>${label}</small></div>`;
}

const page = document.getElementById('page');
let html = '';

html += `<section><h2>1 · Resting notch</h2>
<p class="lede">1:1 points on a 188 × 32 pt notch. Hover a strip to see the swell: the wing grows a little, and the eyes scale up and look down 1 pt.</p>`;
for (const key of ['current', 'capsules', 'pointer']) {
  const v = variants[key];
  html += `<div class="variant"><div class="variant-head"><b>${v.title}</b><span>${v.note}</span></div>
    <div class="pair">${screen('light', v)}${screen('dark', v)}</div></div>`;
}
html += `</section>`;

html += `<section><h2>2 · B’s eyes in every state, 3×</h2><div class="detail">
  ${tile('Resting', eyes('', 0).replace('left:calc(50% + 0px)', ''))}
  ${tile('Hover', eyes('', 0).replace('class="eyes "', 'class="eyes" ').replace('left:calc(50% + 0px)', 'transform:translate(-50%,calc(-50% + 1px)) scale(1.12)'))}
  ${tile('Listening', eyes('listen', 0).replace('left:calc(50% + 0px)', ''))}
  ${tile('Working', eyes('glance', 0).replace('left:calc(50% + 0px)', ''))}
  ${tile('Needs review', eyes('review', 0).replace('left:calc(50% + 0px)', ''))}
  ${tile('Asleep', eyes('sleep', 0).replace('left:calc(50% + 0px)', ''))}
</div></section>`;

const peekShape = silhouette({ left: 0, right: 440, height: 256, ear: 18, bottom: 22 });
const peekSVG = `<svg width="476" height="300" viewBox="-18 0 476 300" style="position:absolute;top:0;left:0;overflow:visible">
  <defs>
    <linearGradient id="bodyfill" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/><stop offset="${40/256}" stop-color="#000"/><stop offset="${88/256}" stop-color="#1A1B1D"/><stop offset="1" stop-color="#1A1B1D"/>
    </linearGradient>
    <linearGradient id="keyline" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".10"/>
    </linearGradient>
    <filter id="peekshadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".45"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <path d="${peekShape.d}" fill="url(#bodyfill)" filter="url(#peekshadow)"/>
  <path d="M 0 18 L 0 234 Q 0 256 22 256 L 418 256 Q 440 256 440 234 L 440 18" fill="none" stroke="url(#keyline)" stroke-width="1"/>
</svg>`;

const row = (name, line, meta, cls = '') => `<div class="row"><div class="avatar">${eyes(cls, 0).replace('left:calc(50% + 0px)', '')}</div>
  <div style="min-width:0"><div class="t">${name}</div><div class="s">${line}</div></div><div class="m">${meta}</div></div>`;

html += `<section><h2>3 · Peek on hover, 440 pt</h2>
<p class="lede">It opens after 180 ms of dwell and grows out of the closed shape. The black crown merges with the hardware, then fades to warm charcoal over 48 pt. Each Perry’s state shows only in its eyes.</p>
<div class="bezel"><div class="screen dark tall"><div class="menubar"></div><div class="hw"></div>
  <div class="peek">${peekSVG}
    <div class="peek-inner">
      <div class="crown"><div class="left">${icon('dotted')}<span>2 working</span></div><div style="display:flex;gap:4px"><div class="iconbtn" aria-label="Settings">${icon('gear')}</div></div></div>
      <div class="rows">
        ${row('Inbox Keeper', 'Archived 12 newsletters and kept 3 that look personal', '8:02')}
        ${row('Downloads Tidy', 'Wants your OK to move 4 installers to the Trash', 'now', 'review')}
        ${row('Weekly Report', 'Drafts Friday’s status from Linear and Notion', 'Fri')}
      </div>
      <div class="footer">
        <span class="chip primary">${icon('mic')}Ask Perry<kbd>⌥⌘P</kbd></span>
        <span class="chip">${icon('plus')}New Perry</span>
        <span class="round" aria-label="Open Home">${icon('expand')}</span>
      </div>
    </div>
  </div>
</div></div></section>`;

const listenShape = silhouette({ left: -half - 2 - 38, right: half + 2 + 38 });
const listening = theme => `<div class="bezel"><div class="screen ${theme}"><div class="menubar"></div><div class="hw"></div>${shapeSVG(listenShape)}
  <div class="wave" style="left:calc(50% - ${half + 2 + 19}px)"><i></i><i></i><i></i><i></i><i></i></div>${eyes('listen', half + 2 + 19)}</div></div>`;

html += `<section><h2>4 · Listening</h2>
<p class="lede">Balanced wings while Perry listens: a live level on the left, brighter mint eyes on the right. Working and needs-review use the same left wing for a glyph or a count.</p>
<div class="pair">${listening('light')}${listening('dark')}</div></section>`;

html += `<section><h2>How to choose</h2><ul class="notes">
  <li><b>A</b> is today: the plate reaches 26 pt past both sides of the notch, so a black bar crosses the menu bar on a light wallpaper.</li>
  <li><b>B</b> adds one 38 pt wing and nothing else. The eyes are twice the size, warm white, and lit by the accent. This is the plan default (D5).</li>
  <li><b>C</b> uses the same wing, but the cursor buddy itself rests in the notch, so the pointer the user sees in Guide is the same character.</li>
</ul></section>`;

page.innerHTML = html;

function blinkLoop() {
  const sets = [...document.querySelectorAll('.screen .eyes:not(.old):not(.sleep)')];
  const delay = 3200 + Math.random() * 4300;
  setTimeout(() => {
    for (const el of sets) { el.classList.remove('blink'); void el.offsetWidth; el.classList.add('blink'); }
    blinkLoop();
  }, delay);
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) blinkLoop();
</script>
</body>
</html>
