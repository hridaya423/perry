# Fallback manifest only — CuaCapabilityManifest generates the live ceiling
# per spawn; this file exists so discovery still succeeds if generation fails.
version: 3
expires_after: 8h
idle_timeout: 30m

allow:
  tools:
    - check_permissions
    - start_session
    - end_session
    - list_windows
    - get_window_state
    - click
    - right_click
    - double_click
    - scroll
    - type_text
    - press_key
    - hotkey
    - drag
    - set_value
    - run_steps

resources:
  apps:
    - bundle_id: com.apple.finder
      launch: false
      windows: all
      terminate: deny
    - bundle_id: com.apple.Preview
      launch: false
      windows: all
      terminate: deny
    - bundle_id: com.apple.systempreferences
      launch: false
      windows: all
      terminate: deny
    - bundle_id: com.apple.TextEdit
      launch: false
      windows: all
      terminate: deny
    - bundle_id: com.microsoft.Excel
      launch: false
      windows: all
      terminate: deny
    - bundle_id: com.blackmagic-design.DaVinciResolve
      launch: false
      windows: all
      terminate: deny

  desktop:
    display: false
