name: Perry
options:
  bundleIdPrefix: dev.perry
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"
    CODE_SIGN_ENTITLEMENTS: App/Perry.entitlements
    ENABLE_HARDENED_RUNTIME: "YES"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: b6496a74a087257ef5e6da1c5b29a447a60f5bd7
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7
  PerryCore:
    path: Packages/PerryCore
  PerryRuntimes:
    path: Packages/PerryRuntimes
  PerryOverlay:
    path: Packages/PerryOverlay
  PerryCapture:
    path: Packages/PerryCapture
  PerryGuide:
    path: Packages/PerryGuide
  PerryBrain:
    path: Packages/PerryBrain
targets:
  Perry:
    type: application
    platform: macOS
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: App/Perry-Bridging-Header.h
    sources:
      - path: App
        excludes:
          - Resources/Sounds
      - path: App/Resources/Sounds
        type: folder
        buildPhase: resources
      - path: App/Resources/CHANGELOG.md
        buildPhase: resources
      - path: App/Resources/CodexRuntime
        type: folder
        buildPhase: resources
      - path: App/Resources/CuaDriver
        type: folder
        buildPhase: resources
      - path: App/Resources/LocalEngine
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: PerryCore
      - package: PerryRuntimes
      - package: PerryOverlay
      - package: PerryCapture
      - package: PerryGuide
      - package: PerryBrain
        product: PerryBrain
      - target: perry-mcp
        embed: true
        copy:
          destination: executables
      - target: perry-voice
        embed: true
        copy:
          destination: executables
    preBuildScripts:
      - path: scripts/fetch-codex-runtime.sh
        name: FetchCodexRuntime
        basedOnDependencyAnalysis: false
      - path: scripts/fetch-cua-driver.sh
        name: FetchCuaDriver
        basedOnDependencyAnalysis: false
      - path: scripts/fetch-llama-server.sh
        name: FetchLlamaServer
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Perry
        SUFeedURL: "$(PERRY_UPDATE_FEED_URL)"
        SUPublicEDKey: "$(PERRY_SPARKLE_PUBLIC_KEY)"
        PerryIssuesURL: "$(PERRY_ISSUES_URL)"
        PerryOAuthLinearClientID: "$(PERRY_OAUTH_LINEAR_CLIENT_ID)"
        PerryOAuthGitHubClientID: "$(PERRY_OAUTH_GITHUB_CLIENT_ID)"
        PerryOAuthSlackClientID: "$(PERRY_OAUTH_SLACK_CLIENT_ID)"
        PerryOAuthGoogleClientID: "$(PERRY_OAUTH_GOOGLE_CLIENT_ID)"
        PerryOAuthGoogleClientSecret: "$(PERRY_OAUTH_GOOGLE_CLIENT_SECRET)"
        PerryOAuthNotionClientID: "$(PERRY_OAUTH_NOTION_CLIENT_ID)"
        PerryOAuthNotionClientSecret: "$(PERRY_OAUTH_NOTION_CLIENT_SECRET)"
        PerryOAuthMicrosoftClientID: "$(PERRY_OAUTH_MICROSOFT_CLIENT_ID)"
        SUEnableAutomaticChecks: true
        LSUIElement: true
        NSMicrophoneUsageDescription: "Perry hears you only while you hold the talk key — it never listens in the background."
        NSSpeechRecognitionUsageDescription: "Perry transcribes what you say with Apple Speech, on this Mac, so it can answer. Nothing leaves the Mac for speech."
        NSCalendarsFullAccessUsageDescription: "Perry reads your upcoming events only when you ask about your schedule. It never changes your calendar."
        NSAppleEventsUsageDescription: "Perry can drive the app you're pointing at — only for a task you asked it to do, and you can undo or stop it."
        CFBundleURLTypes:
          - CFBundleURLName: "dev.perry.oauth"
            CFBundleURLSchemes:
              - dev.perry.perry
  perry-mcp:
    type: tool
    platform: macOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ""
        PRODUCT_NAME: perry-mcp
        PRODUCT_BUNDLE_IDENTIFIER: dev.perry.perry-mcp
    sources:
      - path: Packages/PerryBrain/Sources/perry-mcp
    dependencies:
      - package: PerryBrain
        product: PerryBrain
  perry-voice:
    type: tool
    platform: macOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ""
        PRODUCT_NAME: perry-voice
        PRODUCT_BUNDLE_IDENTIFIER: dev.perry.perry-voice
        SWIFT_VERSION: "5.0"
    sources:
      - path: Helpers/perry-voice
    dependencies:
      - package: FluidAudio
        product: FluidAudio
  PerryTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - AppTests
    dependencies:
      - target: Perry
  PerryUITests:
    type: bundle.ui-testing
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Perry
    sources:
      - AppUITests
    dependencies:
      - target: Perry
schemes:
  Perry:
    build:
      targets:
        Perry: all
    test:
      targets:
        - PerryTests
    run:
      config: Debug
  PerryCuaLive:
    build:
      targets:
        Perry: all
    test:
      targets:
        - name: PerryTests
          selectedTests:
            - CuaLiveTests
      environmentVariables:
        PERRY_LIVE_CUA: "1"
  PerryUI:
    build:
      targets:
        Perry: all
        PerryUITests: [test]
    test:
      targets:
        - PerryUITests
