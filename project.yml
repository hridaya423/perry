name: Perry
options:
  bundleIdPrefix: dev.perry
  deploymentTarget:
    macOS: "14.0"
packages:
  PerryCore:
    path: Packages/PerryCore
  PerryRuntimes:
    path: Packages/PerryRuntimes
  PerryOverlay:
    path: Packages/PerryOverlay
  PerryCapture:
    path: Packages/PerryCapture
  PerryGuide:
    path: Packages/PerryGuide
targets:
  Perry:
    type: application
    platform: macOS
    sources:
      - App
      - path: App/Resources/Sounds
        type: folder
        buildPhase: resources
    dependencies:
    dependencies:
      - package: PerryCore
      - package: PerryRuntimes
      - package: PerryOverlay
      - package: PerryCapture
      - package: PerryGuide
    preBuildScripts:
      - path: scripts/fetch-codex-runtime.sh
        name: FetchCodexRuntime
        basedOnDependencyAnalysis: false
    dependencies:
      - package: PerryCore
      - package: PerryRuntimes
      - package: PerryOverlay
      - package: PerryCapture
      - package: PerryGuide
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Perry
        LSUIElement: true
        NSMicrophoneUsageDescription: "Perry uses the microphone only while you hold a session open, for on-device speech recognition."
        NSSpeechRecognitionUsageDescription: "Perry transcribes your requests on device via Apple Speech."
        NSAppleEventsUsageDescription: "Perry drives apps you ask it to drive."
schemes:
  Perry:
    build:
      targets:
        Perry: all
    run:
      config: Debug
